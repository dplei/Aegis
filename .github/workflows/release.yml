# 在 main 上手动触发：Actions 页点 Run workflow，或 `gh workflow run release.yml -f bump=patch`。
# bump 选 patch/minor/major 时，CI 自己改 tauri.conf.json、Cargo.toml、Cargo.lock 的版本号，构建成功后提交到 main 再发版（发完记得本地 git pull）；
# 选 none 就按文件里现有的版本号发。workflow 自己打 v<version> tag 并发 Release，tag 已存在就直接失败。
# 为什么不用推 tag 触发：Actions 缓存按 ref 隔离，tag 名下存的缓存下次发版读不到；在 main 上跑，缓存每次都能复用。
# secret：QINIU_AK / QINIU_SK（七牛，与 loadout、poro-auth 同一账号），mirror job 用来把安装包镜像到国内 CDN。
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 升哪一位版本号（none = 用现有版本号）
        type: choice
        options: [patch, minor, major, none]
        default: patch
      publish:
        description: 发布到 Release（不勾就只构建，用来试流程、预热缓存）
        type: boolean
        default: true

permissions:
  contents: write

concurrency: release

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 升版本号
        if: inputs.bump != 'none'
        shell: pwsh
        run: |
          $old = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $p = [int[]]$old.Split('.')
          switch ("${{ inputs.bump }}") { 'major' { $p = $p[0] + 1, 0, 0 } 'minor' { $p = $p[0], ($p[1] + 1), 0 } 'patch' { $p[2]++ } }
          $new = $p -join '.'
          # 三处都只替换第一处匹配，别碰到依赖的版本号
          $edit = { param($f, $pat, $rep) $t = [IO.File]::ReadAllText($f); $t2 = ([regex]$pat).Replace($t, $rep, 1); if ($t2 -eq $t) { throw "$f 里没找到版本号" }; [IO.File]::WriteAllText($f, $t2) }
          & $edit src-tauri/tauri.conf.json "`"version`": `"$([regex]::Escape($old))`"" "`"version`": `"$new`""
          & $edit src-tauri/Cargo.toml "(?m)^version = `"$([regex]::Escape($old))`"" "version = `"$new`""
          & $edit src-tauri/Cargo.lock "name = `"aegis`"\r?\nversion = `"$([regex]::Escape($old))`"" "name = `"aegis`"`nversion = `"$new`""
          git diff --stat
          "$old → $new"

      - name: 读版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "main") { throw "只能在 main 上发版，当前是 ${{ github.ref_name }}" }
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $obs = (Select-String -Path src-tauri/Cargo.toml -Pattern '^libobs-version = "(.+)"').Matches[0].Groups[1].Value
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and "${{ inputs.publish }}" -eq "true") { throw "v$v 已经发布过了，先改 tauri.conf.json 的 version" }
          $global:LASTEXITCODE = 0 # 没找到时 gh 返回 1，不清零的话 pwsh 步骤会按它判失败
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "obs=$obs" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # OBS 运行时只跟 libobs-version 有关：命中缓存就跳过编译 cargo-obs-build 和下载 OBS
      - name: 缓存 OBS 运行时
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: obs-runtime
          key: obs-runtime-${{ steps.ver.outputs.obs }}-v1

      - name: 准备 OBS 运行时
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # cargo-obs-build 下载 OBS 时避开 GitHub 限流
        run: |
          cargo install cargo-obs-build --locked
          cd src-tauri
          cargo obs-build build --out-dir ../obs-runtime --remove-pdbs
          # 不做直播：去掉启动时会联网更新平台列表的 rtmp-services 插件
          Remove-Item -Force ../obs-runtime/obs-plugins/64bit/rtmp-services.dll -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ../obs-runtime/data/obs-plugins/rtmp-services -ErrorAction SilentlyContinue

      - run: pnpm tauri build

      - name: 发布到 Release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if ("${{ inputs.bump }}" -ne "none") {
            # 构建成功才提交版本号：构建失败不会在 main 上留下没发出去的版本
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "发布 $tag"
            git push origin HEAD:main
          }
          $sha = git rev-parse HEAD
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release create $tag $exe.FullName --target $sha --title "Aegis $tag" --generate-notes `
            --notes "Windows 10/11 + NVIDIA 显卡。国内下载：https://cdn.suibianwanwan.fun/aegis/aegis-setup.exe（七牛 CDN，始终是最新版）。Code signing policy：https://github.com/${{ github.repository }}#code-signing-policy"

  # 镜像到七牛（国内下载），照搬 dplei/loadout 的 mirror job：同一 bucket / CDN，前缀 aegis
  mirror:
    needs: windows
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 跨境上传偶尔卡住
    env:
      TAG: ${{ needs.windows.outputs.tag }}
      BUCKET: dplay-release
      PREFIX: aegis
      CDN: https://cdn.suibianwanwan.fun
    steps:
      - name: 检查 QINIU_AK / QINIU_SK 已配置（值为空时 qshell 只报 "Name can't be empty"）
        if: ${{ env.AK == '' || env.SK == '' }}
        env: { AK: '${{ secrets.QINIU_AK }}', SK: '${{ secrets.QINIU_SK }}' }
        run: |
          echo "::error::secrets.QINIU_AK 或 QINIU_SK 为空：在仓库 Settings → Secrets → Actions 设置（与 loadout 同值）"
          exit 1
      - name: 下载 Release 资产
        run: gh release download "$TAG" -R "${{ github.repository }}" -p '*-setup.exe' -D dist
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: 安装 qshell
        run: |
          curl -fsSL https://github.com/qiniu/qshell/releases/download/v2.19.13/qshell-v2.19.13-linux-amd64.tar.gz | tar xzO > qshell
          chmod +x qshell && echo "$PWD" >> "$GITHUB_PATH"
          ./qshell account ${{ secrets.QINIU_AK }} ${{ secrets.QINIU_SK }} ci
      - name: 上传（带版本号的原文件名 + 固定名 aegis-setup.exe）
        run: |
          cd dist
          cp "$(ls *-setup.exe)" aegis-setup.exe
          for f in *; do qshell fput "$BUCKET" "$PREFIX/$f" "$f" --overwrite; done
      - name: 刷新 CDN（只有固定名会被覆盖）
        run: |
          echo "$CDN/$PREFIX/aegis-setup.exe" > urls.txt
          qshell cdnrefresh -i urls.txt

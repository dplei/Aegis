[package]
name = "aegis"
version = "0.2.0"
edition = "2021"

# OBS 运行时版本：cargo-obs-build 和发版 workflow 的缓存都读这里，升级 libobs 时一起改
[package.metadata]
libobs-version = "32.1.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
wasapi = "0.27"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Registry",
] }
libobs-simple = "9.0.0"
libobs-wrapper = "10.0.1"
display-info = "0.5"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

[profile.release]
strip = true
lto = true
